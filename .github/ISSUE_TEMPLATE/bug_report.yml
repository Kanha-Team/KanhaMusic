name: Bug Report
description: Create a report to help us improve KanhaMusic
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report for KanhaMusic!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
    validations:
      required: true
  - type: input
    id: os-env
    attributes:
      label: Environment / OS
      description: e.g. Ubuntu 24.04 / Docker / VPS / Local
      placeholder: Ubuntu 24.04 LTS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant terminal or container logs (remove private tokens!).
      render: shell
